<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Enchron 产品语义、状态、责任边界与交付证据的可视化图谱。">
  <title>Enchron Product Atlas</title>
  <style>
/*__ATLAS_CSS__*/
  </style>
  <script>
    (() => {
      const requested = new URLSearchParams(location.search).get("theme");
      const preference = ["light", "dark"].includes(requested)
        ? requested
        : (localStorage.getItem("atlas-theme") || "system");
      const resolved = preference === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = preference;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#atlas-main">跳到图谱内容</a>
  <div class="atlas-shell">
    <header class="atlas-header">
      <div>
        <p class="eyebrow">Enchron · Human Memory Model</p>
        <h1>Product Atlas</h1>
        <p class="lede">从真实产品表面进入，用状态变化、空间迁移与责任边界复习 Enchron。图谱只解释一手文档，不产生产品事实。</p>
      </div>
      <div class="header-tools">
        <button class="icon-button" id="toggle-theme" type="button" aria-label="切换白天或暗夜外观">
          <span aria-hidden="true">◐</span>
          <span id="theme-label">跟随系统</span>
        </button>
        <button class="icon-button" id="toggle-delivery" type="button" aria-pressed="false">
          <span class="status-dot" aria-hidden="true"></span>
          交付状态
        </button>
        <button class="icon-button" id="open-help" type="button" aria-expanded="false" aria-controls="help-panel">如何阅读</button>
      </div>
    </header>

    <aside class="help-panel" id="help-panel" hidden>
      <p><strong>先沿 A 空间旅程理解产品行为，再下钻到 B 系统蓝图和 C 状态机器。</strong> 三种表达由信息性质决定，不是给同一内容换皮的主题。</p>
      <p>“已确认”“实现状态”“验证状态”彼此独立。点击来源可以回到一手文档核对。</p>
    </aside>

    <main id="atlas-main">
      <section class="atlas-view is-active" id="view-journeys" data-view-panel="journeys" tabindex="-1">
        <div class="journey-layout">
          <article class="journey-stage" id="journey-stage" tabindex="-1" aria-live="polite"></article>
          <aside class="journey-index" aria-label="产品操作目录">
            <div class="journey-index-head">
              <p class="section-kicker">PRODUCT ACTIONS</p>
              <h2>产品行为</h2>
              <label class="search-field">
                <span class="sr-only">搜索产品操作</span>
                <input id="action-search" type="search" placeholder="搜索操作、界面或所有者">
              </label>
            </div>
            <div id="action-groups"></div>
          </aside>
        </div>
      </section>
    </main>

    <footer>
      <span>Enchron Product Atlas · 手工维护的派生视图</span>
      <span id="source-status">正在核对来源基线…</span>
    </footer>
  </div>

  <dialog id="source-dialog" class="source-dialog">
    <form method="dialog">
      <button class="dialog-close" aria-label="关闭来源详情">×</button>
    </form>
    <div id="source-dialog-content"></div>
  </dialog>

  <script id="atlas-model" type="application/json">/*__ATLAS_MODEL__*/</script>
  <script>
/*__ATLAS_JS__*/
  </script>
</body>
</html>
