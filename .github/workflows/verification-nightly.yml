name: verification-nightly


on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verification:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Run the full verification against main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENCHRON_TEST_SERVICES: "1"
        run: |
          set -euo pipefail
          WORKSPACE=/Volumes/Cortisol/DevSpace/EnchronWorkspace
          MAIN="$WORKSPACE/Enchron"
          REPO="$WORKSPACE/wt-ci"
          [ -d "$REPO" ] || git -C "$MAIN" worktree add --detach "$REPO" HEAD
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)
          git -C "$REPO" -c credential.helper= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --force origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "$REPO" checkout --force --detach "${GITHUB_SHA:-refs/remotes/origin/main}"
          source "$REPO/Scripts/ci/prepare.sh" ci
          python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" tier static --full
