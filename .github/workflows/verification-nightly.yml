name: verification-nightly


on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verification:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Run the full verification against main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENCHRON_REVISION: ${{ github.sha }}
          ENCHRON_TEST_SERVICES: "1"
        run: |
          set -euo pipefail
          WORKSPACE=/Volumes/Cortisol/DevSpace/EnchronWorkspace
          source "$WORKSPACE/Enchron/Scripts/ci/prepare.sh" ci
          python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" tier static
