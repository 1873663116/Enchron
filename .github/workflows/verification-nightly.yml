name: verification-nightly

# Both triggers are owner-controlled: a schedule runs only from the default
# branch of this repository, and `workflow_dispatch` requires write access.
# No pull request event reaches this workflow, which is what makes it safe to
# put real credentials inside the checkout below.

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: false

# The job reads the repository over HTTPS with the run's own token and calls no
# other GitHub API, so read access to contents is the whole requirement.
permissions:
  contents: read

jobs:
  verification:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Run the full verification against main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          WORKSPACE=/Volumes/Cortisol/DevSpace/EnchronWorkspace
          MAIN="$WORKSPACE/Enchron"
          REPO="$WORKSPACE/wt-ci"
          if [ ! -d "$REPO" ]; then
            git -C "$MAIN" worktree add --detach "$REPO" HEAD
          fi
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)
          git -C "$REPO" -c credential.helper= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --force origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "$REPO" checkout --force --detach "${GITHUB_SHA:-refs/remotes/origin/main}"
          # The build caches are the one thing worth carrying between runs.
          # Deleting the 3.3 GB DerivedData tree the full tier leaves behind
          # takes longer on this volume than the job's whole time budget, and
          # both Xcode and SwiftPM invalidate their trees by content.
          # The test services keep their runtime identity documents and the
          # SMB mount point under $WORKSPACE/test-services, outside every
          # checkout, so this clean never walks into a live network mount.
          git -C "$REPO" clean -ffdx \
            -e .build -e .scratch/DerivedData -e .scratch/SourcePackages
          "$REPO/Scripts/provision_vendored_ffmpeg.sh" "$MAIN"
          # The full tier runs ensure_test_services.py, which mounts the SMB
          # share and resolves the WebDAV service through the credentials in
          # .env, and both readers resolve that path inside their own checkout.
          # The copy is created readable only by the runner's user and is
          # removed however this step exits, so the credentials never outlive
          # the job and never wait in the checkout for the next run's clean.
          # No Emby credential is copied: the live Emby suite is a SwiftPM test
          # target that no tier of run_verification.py executes.
          # A cancelled or timed-out job is signalled rather than returned
          # from, so the two signal traps turn that into an exit and let the
          # EXIT trap run. Only a SIGKILL escapes both, and the next run's
          # `git clean -ffdx` is the backstop for that one case.
          trap 'rm -f "$REPO/.env"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          install -m 600 "$MAIN/.env" "$REPO/.env"
          # A stray .pth left by an unrelated editable install points into
          # ~/Documents, and every interpreter startup under the runner blocked
          # in opendir there for as long as the job was allowed to run. An empty
          # virtual environment processes no .pth file at all, and PYTHONPATH
          # reaches the machine's numpy and Pillow without turning that
          # directory back into a site directory, which is what would execute
          # the .pth again.
          VENV="$WORKSPACE/wt-ci-venv"
          if ! "$VENV/bin/python3" -c "" 2>/dev/null; then
            rm -rf "$VENV"
            python3 -S -m venv --without-pip "$VENV"
          fi
          export PYTHONPATH="$(python3 -S -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          export PATH="$VENV/bin:$PATH"
          python3 "$REPO/Scripts/rules/run_verification.py"
