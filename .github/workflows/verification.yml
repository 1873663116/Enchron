name: verification


on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verification:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Run the quick verification at the pushed revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENCHRON_REVISION: ${{ github.sha }}
          ENCHRON_FETCH_TAGS: "1"
        run: |
          set -euo pipefail
          WORKSPACE=/Volumes/Cortisol/DevSpace/EnchronWorkspace
          source "$WORKSPACE/Enchron/Scripts/ci/prepare.sh" ci
          python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" tier static
