name: verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verification
  cancel-in-progress: false

jobs:
  verification:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Run the quick verification at the revision under review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          WORKSPACE=/Volumes/Cortisol/DevSpace/EnchronWorkspace
          MAIN="$WORKSPACE/Enchron"
          REPO="$WORKSPACE/wt-ci"
          if [ ! -d "$REPO" ]; then
            git -C "$MAIN" worktree add --detach "$REPO" HEAD
          fi
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)
          git -C "$REPO" -c credential.helper= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --force origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/pull/*/merge:refs/remotes/origin/pull/*/merge'
          git -C "$REPO" checkout --force --detach "$GITHUB_SHA"
          # ensure_test_services.py mounts the SMB test share under
          # .build/regression-smb-source, and a clean that walks into a live
          # mount enumerates the whole remote share: the run against d2440337
          # sat in `git clean` for 48 minutes at 0.01s of CPU, reading
          # //Mac-mini.local/TestMedia over the network. Unmount whatever a
          # previous run left behind before cleaning anything.
          # `grep` exits 1 when nothing is mounted under the worktree, which
          # is the ordinary case and not a failure of this step.
          MOUNTED=$(mount | sed -n 's/^.* on \(.*\) ([^)]*)$/\1/p' \
            | grep "^$REPO/" || true)
          if [ -n "$MOUNTED" ]; then
            printf '%s\n' "$MOUNTED" | while IFS= read -r point; do
              # A graceful umount on a busy SMB mount blocks with no deadline
              # of its own, which turns this step into the hang it exists to
              # prevent. Force is the only form used here.
              umount -f "$point" 2>/dev/null \
                || diskutil unmount force "$point" >/dev/null 2>&1 \
                || echo "could not unmount $point; the clean skips it"
            done
          fi
          # The build caches are the one thing worth carrying between runs.
          # Deleting the 3.3 GB DerivedData tree the full tier leaves behind
          # takes longer on this volume than the job's whole time budget, and
          # both Xcode and SwiftPM invalidate their trees by content.
          git -C "$REPO" clean -ffdx \
            -e .build -e .scratch/DerivedData -e .scratch/SourcePackages
          "$REPO/Scripts/provision_vendored_ffmpeg.sh" "$MAIN"
          cp "$MAIN/.env" "$REPO/.env"
          # The Emby identity file is gitignored, so a fresh worktree has none
          # and `ensure_test_services.py` compares every observed identity
          # against the empty string: emby and webdav both read
          # `identity-mismatch` for a server that is answering correctly.
          EMBY_IDENTITY=Tests/EmbyPackageTests/Fixtures/EmbyServerCredentials.local.json
          if [ -f "$MAIN/$EMBY_IDENTITY" ]; then
            mkdir -p "$REPO/$(dirname "$EMBY_IDENTITY")"
            cp "$MAIN/$EMBY_IDENTITY" "$REPO/$EMBY_IDENTITY"
          fi
          # One WebDAV daemon can hold port 8443, and it is the one the main
          # checkout started. Its certificate fingerprint and service id live in
          # this runtime document; without it the worktree compares the live
          # daemon against a fingerprint from a daemon of its own that no longer
          # runs, and calls the answer a mismatch.
          WEBDAV_RUNTIME=.build/regression-remote-source/runtime.json
          if [ -f "$MAIN/$WEBDAV_RUNTIME" ]; then
            mkdir -p "$REPO/$(dirname "$WEBDAV_RUNTIME")"
            cp "$MAIN/$WEBDAV_RUNTIME" "$REPO/$WEBDAV_RUNTIME"
          fi
          # A stray .pth left by an unrelated editable install points into
          # ~/Documents, and every interpreter startup under the runner blocked
          # in opendir there for as long as the job was allowed to run. An empty
          # virtual environment processes no .pth file at all, and PYTHONPATH
          # reaches the machine's numpy and Pillow without turning that
          # directory back into a site directory, which is what would execute
          # the .pth again.
          VENV="$WORKSPACE/wt-ci-venv"
          if ! "$VENV/bin/python3" -c "" 2>/dev/null; then
            rm -rf "$VENV"
            python3 -S -m venv --without-pip "$VENV"
          fi
          export PYTHONPATH="$(python3 -S -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          export PATH="$VENV/bin:$PATH"
          python3 "$REPO/Scripts/rules/run_verification.py" --quick
