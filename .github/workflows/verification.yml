name: verification


on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verification:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Run CI at the pushed or requested revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          WORKSPACE=/Volumes/Cortisol/DevSpace/EnchronWorkspace
          MAIN="$WORKSPACE/Enchron"
          REPO="$WORKSPACE/wt-ci"
          [ -d "$REPO" ] || git -C "$MAIN" worktree add --detach "$REPO" HEAD
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)
          git -C "$REPO" -c credential.helper= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags --force origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              '+refs/pull/*/head:refs/remotes/origin/pull/*'
          head_sha="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head_sha="$PR_HEAD_SHA"
          fi
          git -C "$REPO" checkout --force --detach "$head_sha"
          source "$REPO/Scripts/ci/prepare.sh" ci
          python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" plan check
          case "$EVENT_NAME" in
            push)
              python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" \
                tier static --event push --remote-oid "$PUSH_BEFORE"
              ;;
            pull_request)
              python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" \
                tier static --event pr --base-ref "$PR_BASE_REF"
              ;;
            *)
              python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" \
                tier static
              ;;
          esac
          SIMULATOR=$(xcrun simctl list devices available --json | python3 -c 'import json, sys
          devices = [
              device
              for runtime, items in json.load(sys.stdin)["devices"].items()
              if "visionOS" in runtime or "xrOS" in runtime
              for device in items
              if device.get("isAvailable") and "Apple Vision Pro" in device.get("name", "")
          ]
          print(devices[0]["udid"] if devices else "")')
          if [ -z "$SIMULATOR" ]; then
            echo "no available visionOS simulator on this runner" >&2
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          export DEVELOPER_DIR="$(xcode-select -p)"
          export ENCHRON_TARGET_DEVICE="$SIMULATOR"
          python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" tier build
          python3 "$ENCHRON_REPO/Scripts/console/cli.py" --root "$ENCHRON_REPO" tier unit
