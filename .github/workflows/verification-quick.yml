name: verification-quick

on:
  push:
    branches: [perf/presentation-switch-source-reopen]

concurrency:
  group: verification
  cancel-in-progress: false

jobs:
  quick:
    runs-on: self-hosted
    steps:
      - name: Run the quick gauntlet at the pushed revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN=/Volumes/Cortisol/DevSpace/EnchronWorkspace/Enchron
          REPO=/Volumes/Cortisol/DevSpace/EnchronWorkspace/wt-ci
          FFMPEG=Packages/PlaybackCore/Vendor/FFmpeg/PlaybackFFmpeg.xcframework
          # The worktree and the vendored framework are both untracked state on
          # this machine, so build them when they are absent rather than failing.
          if [ ! -d "$REPO" ]; then
            git -C "$MAIN" worktree add --detach "$REPO" HEAD
          fi
          # The runner's launchd session has no Keychain access, so git must
          # never consult a credential helper. Pushes from this Mac already
          # place the commit in the shared object store; fetch only when the
          # revision arrived from elsewhere, authenticated by the job token.
          if ! git -C "$REPO" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)
            git -C "$REPO" -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              fetch origin
          fi
          git -C "$REPO" checkout --force --detach "$GITHUB_SHA"
          if [ ! -d "$REPO/$FFMPEG" ]; then
            ln -s "$MAIN/$FFMPEG" "$REPO/$FFMPEG"
          fi
          python3 "$REPO/Scripts/verification/run_verification_gauntlet.py" --quick
