name: verification-full

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: verification
  cancel-in-progress: false

jobs:
  full:
    runs-on: self-hosted
    steps:
      - name: Run the full gauntlet at the latest main revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN=/Volumes/Cortisol/DevSpace/EnchronWorkspace/Enchron
          REPO=/Volumes/Cortisol/DevSpace/EnchronWorkspace/wt-ci
          FFMPEG=Packages/PlaybackCore/Vendor/FFmpeg/PlaybackFFmpeg.xcframework
          # The worktree and the vendored framework are both untracked state on
          # this machine, so build them when they are absent rather than failing.
          if [ ! -d "$REPO" ]; then
            git -C "$MAIN" worktree add --detach "$REPO" HEAD
          fi
          # The runner's launchd session has no Keychain access, so git must
          # never consult a credential helper; authenticate with the job token.
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)
          git -C "$REPO" -c credential.helper= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch origin
          git -C "$REPO" checkout --force --detach origin/perf/presentation-switch-source-reopen
          if [ ! -d "$REPO/$FFMPEG" ]; then
            ln -s "$MAIN/$FFMPEG" "$REPO/$FFMPEG"
          fi
          python3 "$REPO/Scripts/verification/run_verification_gauntlet.py"
