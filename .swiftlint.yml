
included:
  - Apps
  - Modules
  - Packages/PlaybackCore/Sources
  - Tests
excluded:
  - .build
  - Packages/PlaybackCore/.build
  - Tests/MediaByteStreamConformance/.build

opt_in_rules:
  - force_unwrapping


disabled_rules:
  - trailing_whitespace
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - type_name
  - function_parameter_count
  - nesting
  - large_tuple
  - closure_parameter_position

identifier_name:
  min_length: 1
  max_length: 80
  allowed_symbols: ["_"]
line_length: 200

custom_rules:

  domain_no_ui_framework:
    regex: 'import\s+(UIKit|SwiftUI|RealityKit|Metal|MetalKit|AMSMB2|ARKit|RealityKitContent)'
    included: ".*/Domain/.*\\.swift"
    message: "Domain 层禁止直接 import UI/渲染/网络框架，请通过 protocol 隔离"
    severity: error

  no_force_try_in_domain:
    regex: 'try!'
    included: ".*/Domain/.*\\.swift"
    message: "Domain 层禁止使用 try!，请用 do-catch 显式处理错误"
    severity: error

  components_use_animation_tokens:
    regex: '\.(easeOut|easeIn|spring)\(|\.animation\(\.default'
    included: ".*/Components/.*\\.swift"
    message: "稳定组件动效须走 DesignTokens.AnimationToken，不要用裸 .easeOut/.spring/.default"
    severity: error

  components_no_hardcoded_color:
    regex: 'Color\(red:|Color\(hex:'
    included: ".*/Components/.*\\.swift"
    message: "稳定组件颜色须走 design tokens，禁止 Color(red:/Color(hex: 硬编码"
    severity: error
